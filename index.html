<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FuturON">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f172a">
    <meta name="description" content="FuturON Preschool - Student Daily Updates Dashboard">
    <meta name="format-detection" content="telephone=yes">
    <link rel="apple-touch-icon" href="images/fps-tree-logo.jpg">
    <link rel="manifest" href="manifest.json">
    <title>FuturON Preschool - Student Progress Report</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            /* MD3 Color System - Dark */
            --md-primary: #93c5fd;
            --md-on-primary: #003258;
            --md-primary-container: rgba(59,130,246,0.15);
            --md-secondary: #a5b4fc;
            --md-tertiary: #86efac;
            --md-error: #fca5a5;
            --md-surface: #0f172a;
            --md-surface-dim: #0a0f1e;
            --md-surface-container-lowest: #080c18;
            --md-surface-container-low: #0d1325;
            --md-surface-container: rgba(15,23,42,0.85);
            --md-surface-container-high: rgba(30,41,59,0.9);
            --md-surface-container-highest: rgba(51,65,85,0.8);
            --md-on-surface: #e2e8f0;
            --md-on-surface-variant: #94a3b8;
            --md-outline: rgba(71,85,105,0.6);
            --md-outline-variant: rgba(51,65,85,0.4);
            /* MD3 Elevation */
            --md-elevation-1: 0 1px 3px 1px rgba(0,0,0,0.15), 0 1px 2px rgba(0,0,0,0.3);
            --md-elevation-2: 0 2px 6px 2px rgba(0,0,0,0.15), 0 1px 2px rgba(0,0,0,0.3);
            --md-elevation-3: 0 4px 8px 3px rgba(0,0,0,0.15), 0 1px 3px rgba(0,0,0,0.3);
            --md-elevation-4: 0 6px 10px 4px rgba(0,0,0,0.15), 0 2px 3px rgba(0,0,0,0.3);
            --md-elevation-5: 0 8px 12px 6px rgba(0,0,0,0.15), 0 4px 4px rgba(0,0,0,0.3);
            /* MD3 Shape */
            --md-shape-xs: 4px;
            --md-shape-sm: 8px;
            --md-shape-md: 12px;
            --md-shape-lg: 16px;
            --md-shape-xl: 28px;
            /* MD3 Motion */
            --md-motion-standard: cubic-bezier(0.2, 0, 0, 1);
            --md-motion-emphasized: cubic-bezier(0.2, 0, 0, 1);
            --md-motion-emphasized-decelerate: cubic-bezier(0.05, 0.7, 0.1, 1);
            --md-motion-emphasized-accelerate: cubic-bezier(0.3, 0, 0.8, 0.15);
            --md-duration-short: 200ms;
            --md-duration-medium: 300ms;
            --md-duration-long: 500ms;
            /* Legacy mappings */
            --bg-primary: #0a0f1e;
            --bg-card: rgba(15,23,42,0.6);
            --bg-sidebar: rgba(15,23,42,0.92);
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-muted: #78859b;
            --border-subtle: rgba(51,65,85,0.5);
            --border-card: rgba(100,116,139,0.15);
            --card-shadow: var(--md-elevation-1);
            --card-inset: none;
            /* MD3 State Layer */
            --md-state-hover: 0.08;
            --md-state-focus: 0.12;
            --md-state-pressed: 0.12;
        }
        body.theme-light {
            --md-primary: #1d4ed8;
            --md-on-primary: #ffffff;
            --md-primary-container: rgba(59,130,246,0.08);
            --md-secondary: #4f46e5;
            --md-tertiary: #059669;
            --md-error: #dc2626;
            --md-surface: #fafbff;
            --md-surface-dim: #d9dce3;
            --md-surface-container-lowest: #ffffff;
            --md-surface-container-low: #f3f4f8;
            --md-surface-container: rgba(255,255,255,0.92);
            --md-surface-container-high: rgba(241,245,249,0.95);
            --md-surface-container-highest: rgba(226,232,240,0.9);
            --md-on-surface: #1c1b1f;
            --md-on-surface-variant: #49454f;
            --md-outline: rgba(148,163,184,0.6);
            --md-outline-variant: rgba(203,213,225,0.5);
            --md-elevation-1: 0 1px 3px 1px rgba(0,0,0,0.08), 0 1px 2px rgba(0,0,0,0.04);
            --md-elevation-2: 0 2px 6px 2px rgba(0,0,0,0.08), 0 1px 2px rgba(0,0,0,0.04);
            --md-elevation-3: 0 4px 8px 3px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.04);
            --md-elevation-4: 0 6px 10px 4px rgba(0,0,0,0.08), 0 2px 3px rgba(0,0,0,0.04);
            --md-elevation-5: 0 8px 12px 6px rgba(0,0,0,0.08), 0 4px 4px rgba(0,0,0,0.04);
            --bg-primary: #f0f4ff;
            --bg-card: rgba(255,255,255,0.95);
            --bg-sidebar: rgba(255,255,255,0.98);
            --text-primary: #1c1b1f;
            --text-secondary: #49454f;
            --text-muted: #79747e;
            --border-subtle: rgba(203,213,225,0.7);
            --border-card: rgba(148,163,184,0.2);
            --card-shadow: var(--md-elevation-1);
            --card-inset: none;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
            font-variant-numeric: tabular-nums;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transition: background var(--md-duration-medium) var(--md-motion-standard), color var(--md-duration-medium) var(--md-motion-standard);
            font-size: 14px;
            letter-spacing: -0.006em;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                radial-gradient(ellipse at 15% 15%, rgba(59,130,246,0.12) 0%, transparent 45%),
                radial-gradient(ellipse at 85% 85%, rgba(139,92,246,0.10) 0%, transparent 45%),
                radial-gradient(ellipse at 50% 50%, rgba(16,185,129,0.05) 0%, transparent 55%);
            pointer-events: none;
            z-index: 0;
            animation: meshMove 30s ease-in-out infinite alternate;
        }
        
        /* Animations */
        @keyframes meshMove { 0% { transform: scale(1); } 100% { transform: scale(1.05) rotate(1deg); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        @keyframes glow { 0%, 100% { box-shadow: 0 0 5px rgba(59,130,246,0.3); } 50% { box-shadow: 0 0 20px rgba(59,130,246,0.5); } }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        @keyframes bounceDot { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        @keyframes logoFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
        @keyframes barGrow { from { width: 0%; } }
        @keyframes countUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes ripple { to { transform: scale(4); opacity: 0; } }
        @keyframes slideInRight { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: translateX(0); } }
        
        .snap-bar-fill { animation: barGrow 0.8s ease-out; }
        .kpi-value { animation: countUp 0.6s ease-out; }
        
        /* Staggered KPI card animations */
        .kpi-card { animation: fadeInUp 0.4s var(--md-motion-emphasized-decelerate) backwards; }
        .kpi-card:nth-child(1) { animation-delay: 0.05s; }
        .kpi-card:nth-child(2) { animation-delay: 0.1s; }
        .kpi-card:nth-child(3) { animation-delay: 0.15s; }
        .kpi-card:nth-child(4) { animation-delay: 0.2s; }
        
        /* Ripple on nav items */
        .nav-item { position: relative; overflow: hidden; }
        .nav-item::after { content: ''; position: absolute; width: 100%; height: 100%; top: 0; left: 0; background: radial-gradient(circle, rgba(147,197,253,0.15) 10%, transparent 60%); opacity: 0; transition: opacity var(--md-duration-short) var(--md-motion-standard); pointer-events: none; }
        .nav-item:active::after { opacity: 1; }
        
        /* MD3 State Layer - Interactive elements */
        .kpi-card::after, .ai-card::after, .student-profile-card::after, .greeting-card::after, .health-card::after {
            content: ''; position: absolute; inset: 0; border-radius: inherit; background: currentColor; opacity: 0; transition: opacity var(--md-duration-short) var(--md-motion-standard); pointer-events: none;
        }
        .kpi-card:hover::after { opacity: var(--md-state-hover); }
        .kpi-card:active::after { opacity: var(--md-state-pressed); }
        
        /* AI tip slide-in */
        .ai-tip { animation: slideInRight 0.3s var(--md-motion-emphasized-decelerate) backwards; }
        .ai-tip:nth-child(1) { animation-delay: 0.05s; }
        .ai-tip:nth-child(2) { animation-delay: 0.1s; }
        .ai-tip:nth-child(3) { animation-delay: 0.15s; }
        .ai-tip:nth-child(4) { animation-delay: 0.2s; }
        .ai-tip:nth-child(5) { animation-delay: 0.25s; }
        
        
        .pdf-btn:active { transform: scale(0.96); }
        .theme-toggle:active { transform: scale(0.92); }
        .tab:focus-visible { outline: 2px solid var(--md-primary); outline-offset: 2px; border-radius: 6px; }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; animation-delay: 0ms !important; transition-duration: 0.01ms !important; }
        }
        
        /* Focus visible for accessibility */
        .nav-item:focus-visible, .kpi-card:focus-visible, .pdf-btn:focus-visible, .tab:focus-visible, .theme-toggle:focus-visible { outline: 2px solid var(--md-primary); outline-offset: 3px; border-radius: var(--md-shape-sm); }
        
        /* Heatmap attendance calendar */
        .heatmap-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-top: 0.8rem; }
        .heatmap-header { font-size: 0.7rem; color: #94a3b8; text-align: center; font-weight: 600; text-transform: uppercase; padding: 2px 0; }
        .heatmap-cell { aspect-ratio: 1; border-radius: 3px; min-height: 14px; }
        .heatmap-present { background: rgba(34,197,94,0.6); }
        .heatmap-absent { background: rgba(244,63,94,0.6); }
        .heatmap-holiday { background: rgba(167,139,250,0.5); }
        .heatmap-future { background: rgba(51,65,85,0.3); }
        .heatmap-empty { background: transparent; }
        .heatmap-legend { display: flex; gap: 12px; margin-top: 8px; justify-content: center; flex-wrap: wrap; }
        .heatmap-legend-item { display: flex; align-items: center; gap: 4px; font-size: 0.7rem; color: #94a3b8; }
        .heatmap-legend-dot { width: 8px; height: 8px; border-radius: 2px; }
        
        /* Formal communication */
        .formal-header { font-size: 0.75rem; color: #94a3b8; line-height: 1.7; padding: 1rem 1.2rem; margin-bottom: 1.5rem; border-left: 3px solid rgba(59,130,246,0.4); background: rgba(15,23,42,0.3); border-radius: 0 var(--md-shape-sm) var(--md-shape-sm) 0; }
        .report-footer { text-align: center; padding: 2rem 1rem; margin-top: 2.5rem; border-top: 1px solid rgba(51,65,85,0.4); }
        .report-footer p { font-size: 0.68rem; color: #475569; line-height: 1.8; }
        .report-footer .signature-line { font-size: 0.72rem; color: #94a3b8; font-weight: 600; margin-bottom: 4px; }
        .report-footer .disclaimer { font-size: 0.7rem; color: #475569; font-style: italic; margin-top: 1rem; padding-top: 0.8rem; border-top: 1px solid rgba(51,65,85,0.3); }
        
        /* Calendar Strip */
        .cal-strip { display: flex; gap: 4px; padding: 0.6rem 0; margin-bottom: 1rem; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .cal-day { flex: 1; min-width: 42px; text-align: center; padding: 6px 4px; border-radius: var(--md-shape-sm); background: var(--md-surface-container-high); border: 1px solid var(--md-outline-variant); transition: all var(--md-duration-short) var(--md-motion-standard); }
        .cal-day-name { font-size: 0.65rem; color: #94a3b8; font-weight: 600; text-transform: uppercase; }
        .cal-day-date { font-size: 0.7rem; color: #f8fafc; font-weight: 700; margin: 2px 0; }
        .cal-day-dot { width: 8px; height: 8px; border-radius: 50%; margin: 4px auto 0; }
        .cal-day-status { font-size: 0.5rem; color: #94a3b8; margin-top: 2px; font-weight: 600; }
        .cal-present { background: rgba(34,197,94,0.1); border-color: rgba(34,197,94,0.3); }
        .cal-absent { background: rgba(244,63,94,0.1); border-color: rgba(244,63,94,0.3); }
        .cal-holiday { background: rgba(167,139,250,0.1); border-color: rgba(167,139,250,0.3); }
        .cal-future { opacity: 0.4; }
        
        /* Profile Banner */
        .profile-banner { background: linear-gradient(135deg, rgba(30,58,138,0.5), rgba(88,28,135,0.35)); border-radius: var(--md-shape-lg); padding: 1.5rem; margin-bottom: 1.5rem; border: 1px solid rgba(100,116,139,0.2); display: flex; align-items: center; gap: 1.2rem; backdrop-filter: blur(20px); box-shadow: 0 8px 32px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.08); animation: fadeInUp 0.4s var(--md-motion-emphasized-decelerate); }
        .profile-avatar { width: 70px; height: 70px; border-radius: var(--md-shape-md); object-fit: cover; border: 2px solid rgba(255,255,255,0.15); box-shadow: 0 4px 16px rgba(0,0,0,0.3); }
        .profile-info { flex: 1; }
        .profile-name { font-size: 1.2rem; font-weight: 700; color: #f8fafc; letter-spacing: -0.02em; }
        .profile-class { font-size: 0.68rem; color: #60a5fa; font-weight: 500; margin-top: 2px; letter-spacing: 0.02em; }
        .profile-status { margin-top: 6px; display: flex; gap: 8px; flex-wrap: wrap; }
        
        /* Radial Progress Gauge */
        .radial-gauge { position: relative; width: 120px; height: 120px; margin: 0 auto; }
        .radial-gauge svg { transform: rotate(-90deg); }
        .radial-gauge-value { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 1.6rem; font-weight: 800; color: #f8fafc; }
        .radial-gauge-label { text-align: center; font-size: 0.65rem; color: #94a3b8; margin-top: 6px; }
        
        /* Achievement Badges */
        .achievement-strip { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1.2rem; animation: fadeInUp 0.6s ease; }
        .achievement { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: var(--md-shape-xl); font-size: 0.65rem; font-weight: 600; border: 1px solid; animation: fadeIn 0.5s var(--md-motion-emphasized-decelerate); }
        .ach-gold { background: rgba(251,191,36,0.1); border-color: rgba(251,191,36,0.3); color: #fbbf24; }
        .ach-blue { background: rgba(59,130,246,0.1); border-color: rgba(59,130,246,0.3); color: #60a5fa; }
        .ach-green { background: rgba(34,197,94,0.1); border-color: rgba(34,197,94,0.3); color: #34d399; }
        .ach-purple { background: rgba(167,139,250,0.1); border-color: rgba(167,139,250,0.3); color: #a78bfa; }
        
        /* Layout */
        .app { display: flex; min-height: 100vh; position: relative; z-index: 1; }
        .sidebar {
            width: 250px;
            background: linear-gradient(180deg, rgba(15,23,42,0.95), rgba(15,23,42,0.98));
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-right: 1px solid rgba(51,65,85,0.3);
            padding: 1.2rem 0.8rem;
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            overflow-y: auto;
            box-shadow: 4px 0 24px rgba(0,0,0,0.15);
        }
        .main { margin-left: 250px; flex: 1; padding: 1.8rem 2.2rem 5rem; max-width: 1100px; }
        
        /* Custom scrollbar */
        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-track { background: transparent; }
        .sidebar::-webkit-scrollbar-thumb { background: rgba(100,116,139,0.3); border-radius: 4px; }
        .sidebar::-webkit-scrollbar-thumb:hover { background: rgba(100,116,139,0.5); }
        .main::-webkit-scrollbar { width: 6px; }
        .main::-webkit-scrollbar-track { background: transparent; }
        .main::-webkit-scrollbar-thumb { background: rgba(100,116,139,0.2); border-radius: 6px; }
        .main::-webkit-scrollbar-thumb:hover { background: rgba(100,116,139,0.4); }
        
        /* Sidebar */
        .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 1px solid #334155; }
        .logo-icon { width: 42px; height: 42px; border-radius: var(--md-shape-sm); object-fit: cover; box-shadow: var(--md-elevation-1); }
        .logo-text { font-weight: 600; font-size: 0.9rem; color: #f8fafc; letter-spacing: -0.01em; }
        .logo-sub { color: #64748b; font-size: 0.68rem; margin-top: 2px; font-weight: 400; letter-spacing: 0.01em; }
        
        .nav-category { font-size: 0.62rem; color: #60a5fa; text-transform: uppercase; letter-spacing: 0.08em; margin: 1.8rem 0 0.6rem; font-weight: 600; }
        .nav-item { padding: 0.55rem 0.9rem; border-radius: var(--md-shape-sm); cursor: pointer; font-size: 0.8rem; color: #94a3b8; margin-bottom: 3px; transition: all var(--md-duration-short) var(--md-motion-standard); font-weight: 450; position: relative; }
        .nav-item:hover { background: rgba(51,65,85,0.5); color: #f1f5f9; }
        .nav-item.active { background: rgba(59,130,246,0.08); color: #93c5fd; font-weight: 500; box-shadow: none; }
        .nav-item.active::before { content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 3px; height: 60%; border-radius: 0 3px 3px 0; background: #3b82f6; }
        
        /* Header - School Banner */
        .school-banner {
            background: linear-gradient(135deg, rgba(15,23,42,0.8), rgba(30,41,59,0.6));
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(100,116,139,0.2);
            border-radius: var(--md-shape-lg);
            padding: 1.6rem 2rem;
            margin-bottom: 1.8rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.6s var(--md-motion-emphasized-decelerate);
            box-shadow: 0 8px 32px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.08);
            transition: all var(--md-duration-short) var(--md-motion-standard);
        }
        .school-banner:hover { box-shadow: 0 12px 40px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.1); }
        .school-banner::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(59,130,246,0.08) 0%, rgba(139,92,246,0.05) 50%, rgba(245,158,11,0.03) 100%);
        }
        .school-banner-left { display: flex; align-items: center; gap: 16px; z-index: 1; }
        .school-logo { width: 60px; height: 60px; border-radius: var(--md-shape-md); object-fit: contain; background: #fff; border: 2px solid var(--md-outline-variant); box-shadow: var(--md-elevation-1); padding: 3px; }
        .school-name { font-size: 1.15rem; font-weight: 700; color: #f8fafc; letter-spacing: -0.02em; text-shadow: 0 1px 2px rgba(0,0,0,0.2); }
        .school-address { font-size: 0.7rem; color: #94a3b8; margin-top: 3px; font-weight: 400; line-height: 1.4; }
        .school-badge { z-index: 1; text-align: right; }
        .school-badge-class { font-size: 0.72rem; color: #f59e0b; font-weight: 600; background: rgba(245,158,11,0.1); padding: 4px 12px; border-radius: var(--md-shape-xs); border: 1px solid rgba(245,158,11,0.2); display: inline-block; }
        .school-badge-date { font-size: 0.65rem; color: #64748b; margin-top: 5px; }

        /* Header Cards */
        .header { display: flex; gap: 0.8rem; margin-bottom: 1.8rem; align-items: stretch; animation: fadeInUp 0.5s var(--md-motion-emphasized-decelerate); }
        .student-profile-card {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: linear-gradient(145deg, rgba(15,23,42,0.7), rgba(30,41,59,0.5));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(100,116,139,0.2);
            border-radius: var(--md-shape-lg);
            padding: 1.4rem 1.8rem;
            min-width: 140px;
            transition: all var(--md-duration-short) var(--md-motion-standard);
            box-shadow: 0 4px 24px rgba(0,0,0,0.15), inset 0 1px 0 rgba(255,255,255,0.08);
        }
        .student-profile-card:hover { transform: translateY(-3px); box-shadow: 0 12px 40px rgba(0,0,0,0.2), 0 0 20px rgba(59,130,246,0.08), inset 0 1px 0 rgba(255,255,255,0.1); }

        if (localStorage.getItem('futuron-theme') === 'light') {
            document.body.classList.add('theme-light');
            document.getElementById('theme-icon-dark').style.display = 'none';
            document.getElementById('theme-icon-light').style.display = 'block';
        }
        // Restore saved language
        if (currentLang !== 'en') {
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === currentLang));
        }

        // Check for parent-specific URL: ?student=NAME
        const urlParams = new URLSearchParams(window.location.search);
        const parentMode = urlParams.get('student');
        let isParentView = parentMode && studentsData[parentMode.toUpperCase()];

        let selectedStudent = isParentView ? parentMode.toUpperCase() : Object.keys(studentsData)[0];
        let selectedWeekIdx = 0; // will be set to latest week on data load


        const ALL_DAYS = ['MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];

        // Format week label professionally (e.g., "JULY 2ND WEEK" → "Week 2 — July")
        function formatWeekLabel(label) {
            if (!label) return '';
            const m = label.match(/(JANUARY|FEBRUARY|MARCH|APRIL|MAY|JUNE|JULY|AUGUST|SEPTEMBER|OCTOBER|NOVEMBER|DECEMBER)\s+(\d+)\w*\s+WEEK/i);
            if (m) {
                const month = m[1].charAt(0) + m[1].slice(1).toLowerCase();
                return `Week ${m[2]} \u2014 ${month}`;
            }
            return label;
        }

        // Detect month from data (week labels like "AUGUST 1ST WEEK" or date ranges)
        function getMonthFromData() {
            const months = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
            if (selectedStudent && studentsData[selectedStudent]) {
                const weeks = studentsData[selectedStudent];
                // Check the last week's label for the most recent month
                for (let i = weeks.length - 1; i >= 0; i--) {
                    const lbl = (weeks[i].label || '').toUpperCase();
                    for (const m of months) {
                        if (lbl.includes(m)) return m.charAt(0) + m.slice(1).toLowerCase() + ' 2026';
                    }
                    // Also check date_range (e.g., "Aug 4-9")
                    const dr = (weeks[i].date_range || '').toUpperCase();
                    for (const m of months) {
                        if (dr.includes(m.substring(0, 3))) return m.charAt(0) + m.slice(1).toLowerCase() + ' 2026';
                    }
                }
            }
            return new Date().toLocaleString('en-US', { month: 'long' }) + ' 2026';
        }

        function getWeekDays(week) {
            // Return days in their chronological order from the sheet (as entered by teacher)
            // Parse the date_range to determine actual start day of week
            const dateRange = (week.date_range || '').trim();
            let startDayOfWeek = 0; // default Monday
            if (dateRange) {
                const match = dateRange.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
                if (match) {
                    const d = new Date(parseInt(match[3]), parseInt(match[2]) - 1, parseInt(match[1]));
                    if (!isNaN(d.getTime())) {
                        // JS: 0=Sun,1=Mon,...6=Sat → convert to school order: Mon=0,Tue=1,...Sat=5
                        const jsDay = d.getDay(); // 0=Sun, 1=Mon, ..., 6=Sat
                        startDayOfWeek = jsDay === 0 ? 6 : jsDay - 1; // Mon=0, Tue=1, ..., Sat=5
                    }
                }
            }
            // Build ordered list starting from the actual start day
            const schoolDayOrder = ['MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];
            const orderedDays = [];
            for (let i = 0; i < 6; i++) {
                const idx = (startDayOfWeek + i) % 6;
                const dayName = schoolDayOrder[idx];
                const found = week.days.find(d => d.day === dayName);
                if (found) {
                    orderedDays.push(found);
                } else {
                    orderedDays.push({ day: dayName, arrival_time: 'N/A', snacks: 'N/A', snack_completion: 0, lunch: 'N/A', lunch_completion: 0, interested_in: 'N/A', water_completion: 0, bottle_refill: 0, uniform: 'N/A' });
                }
            }
            return orderedDays;
        }
        function isFutureDay(d) {
            // Compare day's date with current date — future days are not school days yet
            if (!d.date) return false;
            var m = String(d.date).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
            if (!m) return false;
            var dayDate = new Date(parseInt(m[3]), parseInt(m[2]) - 1, parseInt(m[1]));
            var today = new Date();
            today.setHours(0, 0, 0, 0);
            return dayDate > today;
        }
        function getActiveDays(days) {
            // Present days only: must have data (not holiday/future) AND not absent
            return days.filter(d => hasData(d) && !isFutureDay(d) && !isAbsent(d));
        }

        function pct(val) { return Math.min(Math.round(val * 100), 100); }
        function isValidVal(v) { return v && v !== 'N/A' && v !== '-'; }

            if (avg >= 60) return { cls: 'status-moderate', icon: '<span style="color:#f59e0b">' + icon('trending') + '</span>', text: t('hadGoodWeek') };
            return { cls: 'status-concern', icon: '<span style="color:#ef4444">' + icon('alert') + '</span>', text: t('needsAttention') };

            if (!values || values.length < 2) return '';
            const w = 80, h = 24;
            const max = Math.max(...values, 1);
            const pts = values.map((v, i) => `${(i / (values.length - 1)) * w},${h - (v / max) * (h - 4) - 2}`).join(' ');
            const fillPts = `0,${h} ${pts} ${w},${h}`;
            return `<svg width="${w}" height="${h}" style="display:block; margin-top:6px;" aria-hidden="true"><polygon points="${fillPts}" fill="${color}" fill-opacity="0.15"/><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

        function miniBar(pct, color) {

        // Heatmap calendar generator

            if (!days.length || !days[0].date) return '';
            // Get month from first day's date
            const firstDate = String(days[0].date).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
            if (!firstDate) return '';
            const month = parseInt(firstDate[2]) - 1;
            const year = parseInt(firstDate[3]);
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const firstDayOfWeek = (new Date(year, month, 1).getDay() + 6) % 7; // Monday=0
            
            // Build day status map from all weeks in this month
            const dayStatus = {};
            allWeeks.forEach(w => {
                const wDays = getWeekDays(w);
                wDays.forEach(d => {
                    if (!d.date) return;
                    const dm = String(d.date).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
                    if (!dm || parseInt(dm[2]) - 1 !== month) return;
                    const dayNum = parseInt(dm[1]);
                    if (isHoliday(d)) dayStatus[dayNum] = 'holiday';
                    else if (isFutureDay(d)) dayStatus[dayNum] = 'future';
                    else if (isAbsent(d)) dayStatus[dayNum] = 'absent';
                    else if (hasData(d)) dayStatus[dayNum] = 'present';
                });
            });
            
            let html = '<div style="margin-top:1rem;"><div style="font-size:0.62rem; color:#94a3b8; font-weight:600; margin-bottom:6px; text-transform:uppercase; letter-spacing:0.05em;">Monthly Attendance Map</div>';
            html += '<div class="heatmap-grid">';
            // Day headers
            ['M','T','W','T','F','S','S'].forEach(d => { html += `<div class="heatmap-header">${d}</div>`; });
            // Empty cells before first day
            for (let i = 0; i < firstDayOfWeek; i++) html += '<div class="heatmap-cell heatmap-empty"></div>';
            // Day cells
            for (let d = 1; d <= daysInMonth; d++) {
                const status = dayStatus[d] || 'future';
                const cls = status === 'present' ? 'heatmap-present' : status === 'absent' ? 'heatmap-absent' : status === 'holiday' ? 'heatmap-holiday' : 'heatmap-future';
                html += `<div class="heatmap-cell ${cls}" title="Day ${d}: ${status}"></div>`;
            }
            html += '</div>';
            html += '<div class="heatmap-legend"><div class="heatmap-legend-item"><div class="heatmap-legend-dot heatmap-present"></div>Present</div><div class="heatmap-legend-item"><div class="heatmap-legend-dot heatmap-absent"></div>Absent</div><div class="heatmap-legend-item"><div class="heatmap-legend-dot heatmap-holiday"></div>Holiday</div><div class="heatmap-legend-item"><div class="heatmap-legend-dot heatmap-future"></div>Upcoming</div></div>';
            html += '</div>';
            // Heatmap attendance calendar
            const weeks = studentsData[selectedStudent];
            html += generateHeatmap(days, weeks, selectedWeekIdx);

            // Formal report footer
            const reportDate = new Date().toLocaleDateString('en-IN', { day: '2-digit', month: 'long', year: 'numeric' });
            html += `
                <div class="report-footer">
                    <p class="signature-line">Prepared by: Class Teacher, ${SCHOOL.class}</p>
                    <p>FuturON Preschool, Jammalamadugu</p>
                    <p class="disclaimer">This is a system-generated progress report from the FuturON Student Management System. Report generated on ${reportDate}.<br>For queries, contact: futuronpreschooljammalamadugu@gmail.com</p>
                </div>
            `;

            return html;
        }
        function isSecondSaturday(d) {
            if (d.day !== 'SATURDAY') return false;
            if (d.arrival_time && d.arrival_time.toUpperCase().includes('SECOND SATURDAY')) return true;
            if (d.date) {
                var m = String(d.date).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
                if (m) { var day = parseInt(m[1]); if (day >= 8 && day <= 14) return true; }
            }
            return false;
        }
        function isHoliday(d) {
            // Holiday if: Second Saturday OR arrival_time explicitly says HOLIDAY
            if (isSecondSaturday(d)) return true;
            if (d.arrival_time && (d.arrival_time.toUpperCase() === 'HOLIDAY' || d.arrival_time.toUpperCase().includes('HOLIDAY'))) return true;
            return false;
        }
        function hasData(d) {
            // Holidays are never counted as school days
            if (isHoliday(d)) return false;
            // Future days are not school days yet
            if (isFutureDay(d)) return false;
            // School day if it has a date (sheet tracked this day) OR any field has data
            if (d.date && d.date !== '' && d.date !== 'N/A') return true;
            if (d.arrival_time && d.arrival_time !== 'N/A') return true;
            if (d.snacks && d.snacks !== 'N/A') return true;
            if (d.lunch && d.lunch !== 'N/A') return true;
            if (d.snack_completion > 0 || d.lunch_completion > 0 || d.water_completion > 0) return true;
            return false;
        }
        function isAbsent(d) {
            // If no data entered at all, this is a future/excluded day
            if (!hasData(d)) return true;
            // RULE: If arrival_time is NULL/empty/N/A/dash/ABSENT → ABSENT
            if (!d.arrival_time || d.arrival_time === 'N/A' || d.arrival_time === '-' || 
                d.arrival_time === '' || d.arrival_time.toUpperCase() === 'ABSENT') return true;
            return false;
        }

                if (dm) selectedMonth = months[parseInt(dm[1]) - 1] || '';
            }
            if (!selectedMonth) return '';

            const monthDisplay = selectedMonth.charAt(0) + selectedMonth.slice(1).toLowerCase();

            // Filter weeks belonging to this calendar month
            const monthWeeks = [];
            weeks.forEach((w, i) => {
                const wlbl = (w.label || '').toUpperCase();
                let wMonth = '';
                for (const m of months) { if (wlbl.includes(m)) { wMonth = m; break; } }
                if (!wMonth && w.days[0] && w.days[0].date) {
                    const dm = String(w.days[0].date).match(/\d{1,2}\/(\d{1,2})\/\d{4}/);
                    if (dm) wMonth = months[parseInt(dm[1]) - 1] || '';
                }
                if (wMonth === selectedMonth) monthWeeks.push({ week: w, idx: i });
            });

            if (monthWeeks.length === 0) return '';

            let totalPresent = 0, totalAbsent = 0, totalHolidays = 0, totalSchoolDays = 0;
            const weekScores = [];
            monthWeeks.forEach((mw, mi) => {
                const days = mw.week.days;
                const holidays = days.filter(d => isHoliday(d)).length;
                const school = days.filter(d => hasData(d) && !isFutureDay(d)).length;
                const present = days.filter(d => hasData(d) && !isFutureDay(d) && !isAbsent(d)).length;
                const absent = school - present;
                totalHolidays += holidays;
                totalSchoolDays += school;
                totalPresent += present;
                totalAbsent += absent;
                const active = days.filter(d => hasData(d) && !isFutureDay(d) && !isAbsent(d));
                if (active.length > 0) {
                    const lunchDays = active.filter(d => d.day !== 'SATURDAY');
                    const snackAvg = active.reduce((s, d) => s + pct(d.snack_completion), 0) / active.length;
                    const lunchAvg = lunchDays.length ? lunchDays.reduce((s, d) => s + pct(d.lunch_completion), 0) / lunchDays.length : 0;
                    const waterAvg = active.reduce((s, d) => s + pct(d.water_completion), 0) / active.length;
                    const overall = Math.round((snackAvg * 0.25) + (lunchAvg * 0.45) + (waterAvg * 0.30));
                    weekScores.push({ label: 'W' + (mi + 1), score: overall });
                } else { weekScores.push({ label: 'W' + (mi + 1), score: 0 }); }
            });
            const overallNutrition = weekScores.filter(w => w.score > 0).length ? Math.round(weekScores.filter(w => w.score > 0).reduce((s, w) => s + w.score, 0) / weekScores.filter(w => w.score > 0).length) : 0;
            const attendancePct = totalSchoolDays > 0 ? Math.round((totalPresent / totalSchoolDays) * 100) : 0;
            const maxScore = Math.max(...weekScores.map(w => w.score), 1);
            const firstScore = weekScores.find(w => w.score > 0);
            const lastScore = [...weekScores].reverse().find(w => w.score > 0);
            const improvement = firstScore && lastScore ? lastScore.score - firstScore.score : 0;

            return `
                <div class="section-header" style="margin-top:2rem;">${monthDisplay.toUpperCase()} MONTHLY PROGRESS OVERVIEW</div>
                <div class="kpi-grid" style="margin-bottom:1.2rem;">
                    <div class="kpi-card" style="border-top:3px solid #22c55e;">

                    <div class="kpi-card" style="border-top:3px solid #a78bfa;">
                        <div class="kpi-label">Holidays</div>
                        <div class="kpi-value" style="color:#a78bfa; font-size:1.8rem;">${totalHolidays}</div>
                        <div class="kpi-sublabel">Scheduled holidays & closures</div>
                    </div>
                    <div class="kpi-card" style="border-top:3px solid #60a5fa;">
                        <div class="kpi-label">Nutrition Score</div>
                        <div class="kpi-value" style="color:#60a5fa; font-size:1.8rem;">${overallNutrition}%</div>
                        <div class="kpi-sublabel">${overallNutrition >= 90 ? 'Excellent' : overallNutrition >= 75 ? 'Good' : overallNutrition >= 60 ? 'Moderate' : 'Needs Attention'}</div>
                    </div>

                <div class="ai-card" style="margin-bottom:1.2rem;">

                        ${weekScores.map(w => {
                            const height = maxScore > 0 ? Math.max(8, (w.score / maxScore) * 100) : 8;
                            const color = w.score >= 80 ? '#34d399' : w.score >= 60 ? '#60a5fa' : w.score > 0 ? '#fbbf24' : '#334155';
                            return `<div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;">

                    </div>
                </div>

                <div style="margin-bottom:1rem; background:rgba(30,41,59,0.5); border-radius:10px; padding:0.8rem; border:1px solid rgba(51,65,85,0.5);">
                    <div style="display:flex; justify-content:space-between; font-size:0.7rem; color:#94a3b8; margin-bottom:6px;">
                        <span>Attendance: ${totalPresent}/${totalSchoolDays} days (${attendancePct}%)</span>
                    </div>
                    <div style="height:10px; background:#1e293b; border-radius:5px; overflow:hidden; display:flex;">
                        <div style="width:${attendancePct}%; background:linear-gradient(90deg,#22c55e,#34d399); border-radius:5px;"></div>

                        <span style="color:#34d399;">Present ${attendancePct}%</span>
                        <span style="color:#fb7185;">Absent ${100 - attendancePct}%</span>
                    </div>
                </div>

        }

        function renderOverview(days, week) {
            const active = getActiveDays(days);
            // Saturday is half-day (snacks only, no lunch) — exclude Saturday from lunch average
            const lunchDays = active.filter(d => d.day !== 'SATURDAY');
            const snackAvg = active.length ? active.reduce((s, d) => s + pct(d.snack_completion), 0) / active.length : 0;
            const lunchAvg = lunchDays.length ? lunchDays.reduce((s, d) => s + pct(d.lunch_completion), 0) / lunchDays.length : 0;
            const waterAvg = active.length ? active.reduce((s, d) => s + pct(d.water_completion), 0) / active.length : 0;
            const bottleTotal = active.reduce((s, d) => s + d.bottle_refill, 0);
            // Sparkline daily values
            const snackSpark = active.map(d => pct(d.snack_completion));
            const lunchSpark = lunchDays.map(d => pct(d.lunch_completion));
            const waterSpark = active.map(d => pct(d.water_completion));
            
            // Week-over-week comparison deltas
            const weeks = studentsData[selectedStudent];
            const prevWeekData = selectedWeekIdx > 0 ? weeks[selectedWeekIdx - 1] : null;
            let snackDelta = null, lunchDelta = null, waterDelta = null;
            if (prevWeekData) {
                const prevDays = getWeekDays(prevWeekData);
                const prevActive = getActiveDays(prevDays);
                if (prevActive.length) {
                    const prevLunchDays = prevActive.filter(d => d.day !== 'SATURDAY');
                    const prevSnack = prevActive.reduce((s, d) => s + pct(d.snack_completion), 0) / prevActive.length;
                    const prevLunch = prevLunchDays.length ? prevLunchDays.reduce((s, d) => s + pct(d.lunch_completion), 0) / prevLunchDays.length : 0;
                    const prevWater = prevActive.reduce((s, d) => s + pct(d.water_completion), 0) / prevActive.length;
                    snackDelta = Math.round(snackAvg - prevSnack);
                    lunchDelta = Math.round(lunchAvg - prevLunch);
                    waterDelta = Math.round(waterAvg - prevWater);

            }
            function deltaHtml(d) {
                if (d === null) return '';
                if (d > 2) return `<span class="kpi-delta kpi-delta-up">\u25B2 +${d}%</span>`;
                if (d < -2) return `<span class="kpi-delta kpi-delta-down">\u25BC ${d}%</span>`;
                return `<span class="kpi-delta kpi-delta-stable">\u2500 0%</span>`;
            }
            // Count holidays this week (from all days including excluded ones)
            const holidaysThisWeek = week.days.filter(d => isHoliday(d)).length;
            const holidayNames = week.days.filter(d => isHoliday(d)).map(d => isSecondSaturday(d) ? '2nd Saturday' : (d.arrival_time || 'HOLIDAY').replace(/HOLIDAY/i, '').trim() || 'Holiday').join(', ');
            // Only count school days that have data (excludes holidays)
            const totalSchoolDays = days.filter(d => hasData(d)).length || active.length;

            // Achievement badges
            const achievements = [];
            const overallScore = Math.round((snackAvg + lunchAvg + waterAvg) / 3);
            if (active.length === totalSchoolDays && totalSchoolDays >= 5) achievements.push({ icon: icon('trophy'), text: 'Full Attendance', cls: 'ach-gold' });
            if (overallScore >= 95) achievements.push({ icon: icon('star'), text: 'Wellness Star', cls: 'ach-gold' });
            else if (overallScore >= 80) achievements.push({ icon: icon('sparkles'), text: 'Healthy Eater', cls: 'ach-green' });
            if (waterAvg >= 95) achievements.push({ icon: icon('droplet'), text: 'Hydration Champion', cls: 'ach-blue' });
            if (snackAvg >= 95) achievements.push({ icon: icon('apple'), text: 'Snack Excellence', cls: 'ach-green' });
            if (active.length >= 3) {
                const allOnTime = active.every(d => { const m = String(d.arrival_time).match(/(\d{1,2}):(\d{2})/); return m && (parseInt(m[1]) * 60 + parseInt(m[2])) <= 545; });
                if (allOnTime) achievements.push({ icon: icon('clock'), text: 'Punctuality Award', cls: 'ach-purple' });
            }
            const gaugeScore = overallScore;
            const gaugeColor = gaugeScore >= 80 ? '#34d399' : gaugeScore >= 60 ? '#60a5fa' : '#fbbf24';
            const circumference = 2 * Math.PI * 45;
            const dashOffset = circumference - (gaugeScore / 100) * circumference;

            // Quick Summary Card
            const studentNameFormatted = selectedStudent.charAt(0) + selectedStudent.slice(1).toLowerCase();
            const attPct = totalSchoolDays > 0 ? Math.round((active.length / totalSchoolDays) * 100) : 0;
            const overallSt = getOverallStatus(attPct, snackAvg, lunchAvg, waterAvg);
            const concerns = [];
            if (attPct < 60) concerns.push('attendance');

            if (lunchAvg < 60) concerns.push('afternoon meal');
            if (waterAvg < 60) concerns.push('hydration');
            const tipRaw = (typeof AIEngine !== 'undefined' && AIEngine.generateTips) ? AIEngine.generateTips(selectedStudent, selectedWeekIdx)[0] : null;
            const tipText = !tipRaw ? 'Keep up the great routine!' : (typeof tipRaw === 'object' ? (tipRaw.text || 'Keep up the great routine!') : String(tipRaw));

            let html = `

                        <div class="quick-summary-item">${getStatusDot(snackAvg)}<div class="quick-summary-label">${t('nutrition')}</div><div class="quick-summary-value">${Math.round((snackAvg + lunchAvg) / 2)}%</div></div>
                        <div class="quick-summary-item">${getStatusDot(waterAvg)}<div class="quick-summary-label">${t('hydration')}</div><div class="quick-summary-value">${Math.round(waterAvg)}%</div></div>
                        <div class="quick-summary-item">${concerns.length === 0 ? '<span class="quick-summary-dot dot-green"></span>' : '<span class="quick-summary-dot dot-yellow"></span>'}<div class="quick-summary-label">${t('status')}</div><div class="quick-summary-value">${concerns.length === 0 ? t('allGood') : concerns.length + ' ' + t('areas')}</div></div>
                    </div>
                    <div class="quick-summary-tip">${tipText}</div>
                </div>
                <div class="view-toggle">
                    <button class="view-toggle-btn active" data-view="summary" onclick="setViewMode('summary')">${t('summary')}</button>
                    <button class="view-toggle-btn" data-view="detailed" onclick="setViewMode('detailed')">${t('detailed')}</button>
                </div>
                ${achievements.length > 0 ? `<div class="achievement-strip">${achievements.map(a => `<div class="achievement ${a.cls}">${a.icon} ${a.text}</div>`).join('')}</div>` : ''}
                <div class="section-header section-toggle" style="margin-top:1.5rem;" onclick="toggleSection('sec-nourishment')">${t('nourishmentWellness')}</div><div id="sec-nourishment" class="section-content">
                <div class="kpi-grid">
                    <div class="kpi-card border-purple">
                        <div class="kpi-icon" style="background:rgba(139,92,246,0.1);"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 010 8h-1"/><path d="M2 8h16v9a4 4 0 01-4 4H6a4 4 0 01-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg></div>
                        <div class="kpi-label">${t('morningSnack')}<span class="help-tip" data-tip="Percentage of morning snack your child finished at school">?</span></div><div class="kpi-value accent-purple">${pct1(snackAvg)}%</div>${miniBar(snackAvg, '#a78bfa')}${deltaHtml(snackDelta)}<div class="kpi-sublabel">Morning snack consumption rate: ${pct1(snackAvg)}% this week ${getStatusText(snackAvg)}${sparkline(snackSpark, '#a78bfa')}</div>
                    </div>
                    <div class="kpi-card border-green">
                        <div class="kpi-icon" style="background:rgba(16,185,129,0.1);"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 002-2V2"/><path d="M7 2v20"/><path d="M21 15V2v0a5 5 0 00-5 5v6c0 1.1.9 2 2 2h3"/><path d="M18 22V7"/></svg></div>
                        <div class="kpi-label">${t('afternoonMeal')}<span class="help-tip" data-tip="How much of the lunch box your child completed">?</span></div><div class="kpi-value accent-green">${pct1(lunchAvg)}%</div>${miniBar(lunchAvg, '#34d399')}${deltaHtml(lunchDelta)}<div class="kpi-sublabel">Afternoon meal intake rate: ${pct1(lunchAvg)}% this week ${getStatusText(lunchAvg)}${sparkline(lunchSpark, '#34d399')}</div>
                    </div>
                    <div class="kpi-card border-blue">
                        <div class="kpi-icon" style="background:rgba(59,130,246,0.1);"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 11-11.31 0z"/></svg></div>
                        <div class="kpi-label">${t('hydrationLevel')}<span class="help-tip" data-tip="How well your child drinks water at school vs WHO recommended intake">?</span></div><div class="kpi-value accent-blue">${pct1(waterAvg)}%</div>${miniBar(waterAvg, '#60a5fa')}${deltaHtml(waterDelta)}<div class="kpi-sublabel">Water intake rate: ${pct1(waterAvg)}% (WHO guideline: ~${WHO_WATER_STANDARDS[CURRENT_CLASS].schoolLitres}L for ages ${WHO_WATER_STANDARDS[CURRENT_CLASS].ageRange})${sparkline(waterSpark, '#60a5fa')}</div>
                    </div>
                    <div class="kpi-card" style="border-top:3px solid ${gaugeColor};">
                        <div class="radial-gauge" style="width:80px;height:80px;margin:0 auto 8px;">
                            <svg width="80" height="80" viewBox="0 0 80 80"><circle cx="40" cy="40" r="30" fill="none" stroke="rgba(51,65,85,0.4)" stroke-width="7"/><circle cx="40" cy="40" r="30" fill="none" stroke="${gaugeColor}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${2*Math.PI*30}" stroke-dashoffset="${2*Math.PI*30 - (gaugeScore/100)*2*Math.PI*30}" style="transform:rotate(-90deg);transform-origin:center;transition:stroke-dashoffset 1s ease;"/></svg>
                            <div class="radial-gauge-value" style="color:${gaugeColor};font-size:1.2rem;">${gaugeScore}%</div>
                        </div>
                        <div class="kpi-label">Overall Score</div>
                        <div class="kpi-sublabel">${gaugeScore >= 90 ? 'Excellent' : gaugeScore >= 75 ? 'Good' : gaugeScore >= 60 ? 'Moderate' : 'Needs Attention'}</div>
                    </div>
                </div>

                <div class="section-header">ATTENDANCE & HYDRATION</div>
                <div class="kpi-grid">
                    <div class="kpi-card" style="border-top:3px solid #22c55e;">
                        <div class="kpi-icon" style="background:rgba(34,197,94,0.1);"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></div>
                        <div class="kpi-label">Days Attended</div><div class="kpi-value" style="color:#34d399;">${active.length}</div><div class="kpi-sublabel">Present for ${active.length} of ${totalSchoolDays} working days this week</div>
                    </div>
                    <div class="kpi-card" style="border-top:3px solid #f43f5e;">
                        <div class="kpi-icon" style="background:rgba(244,63,94,0.1);"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg></div>

                        <div class="kpi-label">Daily Hydration</div><div class="kpi-value accent-orange">${bottleTotal + active.length}</div><div class="kpi-sublabel">${active.length} bottles carried + ${bottleTotal} refills at school</div>
                    </div>

            `;

            // Daily Nutrition Insight - calculates overall nutrition % from food + water
            // Saturday = half-day (snacks + water only, no lunch)
            const nutritionPerDay = active.map(d => {

                const lunch = pct(d.lunch_completion);
                const water = pct(d.water_completion);
                if (d.day === 'SATURDAY') {
                    // Half-day: only snacks (45%) + water (55%)
                    return Math.round((snack * 0.45) + (water * 0.55));
                }
                // Full day: snacks (25%) + lunch (45%) + water (30%)
                return Math.round((snack * 0.25) + (lunch * 0.45) + (water * 0.30));
            });
            const avgNutrition = nutritionPerDay.length ? Math.round(nutritionPerDay.reduce((s, v) => s + v, 0) / nutritionPerDay.length) : 0;
            const nutritionGrade = avgNutrition >= 90 ? 'Excellent' : avgNutrition >= 75 ? 'Good' : avgNutrition >= 60 ? 'Moderate' : 'Needs Attention';
            const nutritionColor = avgNutrition >= 90 ? '#34d399' : avgNutrition >= 75 ? '#60a5fa' : avgNutrition >= 60 ? '#fbbf24' : '#fb7185';

            html += `
                <div class="section-header">DAILY NUTRITION INSIGHT</div>

                    <div style="display:flex; align-items:center; gap:20px; margin-bottom:16px;">
                        <div style="text-align:center;">
                            <div style="font-size:2.4rem; font-weight:700; color:${nutritionColor};">${avgNutrition}%</div>
                            <div style="font-size:0.72rem; color:#94a3b8; margin-top:4px;">Weekly Average</div>
                            <div style="font-size:0.68rem; font-weight:600; color:${nutritionColor}; margin-top:2px;">${nutritionGrade}</div>
                        </div>
                        <div style="flex:1;">
                            <div style="font-size:0.78rem; color:#cbd5e1; line-height:1.6; margin-bottom:10px;">This score represents how well your child met their daily nutrition needs at school, combining snack intake (25%), lunch box completion (45%), and water drinking (30%) as per WHO guidelines for ages ${WHO_WATER_STANDARDS[CURRENT_CLASS].ageRange}.</div>
                            <div style="display:flex; gap:8px; flex-wrap:wrap;">
                                <span style="font-size:0.65rem; padding:3px 8px; border-radius:4px; background:rgba(139,92,246,0.1); color:#a78bfa; border:1px solid rgba(139,92,246,0.2);">Morning Snack: 25%</span>
                                <span style="font-size:0.65rem; padding:3px 8px; border-radius:4px; background:rgba(16,185,129,0.1); color:#34d399; border:1px solid rgba(16,185,129,0.2);">Afternoon Meal: 45%</span>
                                <span style="font-size:0.65rem; padding:3px 8px; border-radius:4px; background:rgba(59,130,246,0.1); color:#60a5fa; border:1px solid rgba(59,130,246,0.2);">Hydration: 30%</span>
                            </div>
                        </div>
                    </div>
                    <div style="font-size:0.68rem; color:#64748b; text-transform:uppercase; font-weight:600; margin-bottom:8px;">Day-wise Wellness Score</div>
                    <div style="display:flex; gap:6px; flex-wrap:wrap;">
                        ${week.days.filter(d => d.date && d.date !== '' && !isFutureDay(d)).map(d => {
                            if (isHoliday(d)) {
                                return `<div style="flex:1; min-width:60px; text-align:center; padding:8px 4px; background:rgba(167,139,250,0.08); border:1px solid rgba(167,139,250,0.2); border-radius:8px;"><div style="font-size:0.6rem; color:#94a3b8;">${d.day.slice(0,3)}</div><div style="font-size:0.85rem; font-weight:700; color:#a78bfa;">H</div><div style="font-size:0.5rem; color:#a78bfa; font-weight:600;">${isSecondSaturday(d) ? '2nd SAT' : (d.arrival_time||'').replace(/HOLIDAY/i,'').trim() || 'HOLIDAY'}</div></div>`;
                            }
                            if (isAbsent(d)) {
                                return `<div style="flex:1; min-width:60px; text-align:center; padding:8px 4px; background:rgba(244,63,94,0.08); border:1px solid rgba(244,63,94,0.2); border-radius:8px;"><div style="font-size:0.6rem; color:#94a3b8;">${d.day.slice(0,3)}</div><div style="font-size:1rem; font-weight:700; color:#f43f5e;">--</div><div style="font-size:0.55rem; color:#f43f5e; font-weight:600;">ABSENT</div></div>`;
                            }
                            const snk = pct(d.snack_completion);
                            const lnc = pct(d.lunch_completion);
                            const wtr = pct(d.water_completion);
                            const dayScore = d.day === 'SATURDAY' ? Math.round((snk * 0.45) + (wtr * 0.55)) : Math.round((snk * 0.25) + (lnc * 0.45) + (wtr * 0.30));
                            return `<div style="flex:1; min-width:60px; text-align:center; padding:8px 4px; background:rgba(${dayScore >= 80 ? '16,185,129' : dayScore >= 60 ? '59,130,246' : '245,158,11'},0.08); border:1px solid rgba(${dayScore >= 80 ? '16,185,129' : dayScore >= 60 ? '59,130,246' : '245,158,11'},0.2); border-radius:8px;"><div style="font-size:0.6rem; color:#94a3b8;">${d.day.slice(0,3)}</div><div style="font-size:1rem; font-weight:700; color:${dayScore >= 80 ? '#34d399' : dayScore >= 60 ? '#60a5fa' : '#fbbf24'};">${dayScore}%</div></div>`;
                        }).join('')}
                    </div>
                    <div style="font-size:0.65rem; color:#94a3b8; margin-top:6px; font-style:italic;">Score from ${active.length} present day(s). Holidays & absent days excluded.</div>
                </div>
            `;

            // Daily snapshot - compute dates from date_range
            const weekDateRange = (week.date_range || '').trim();
            let weekStartDate = null;
            const drMatch = weekDateRange.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
            if (drMatch) weekStartDate = new Date(parseInt(drMatch[3]), parseInt(drMatch[2]) - 1, parseInt(drMatch[1]));

            function getDayDate(d) {
                // Use date from sheet data if available (DD/MM/YYYY format)
                if (d.date) {
                    const m = String(d.date).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
                    if (m) {
                        const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
                        return `${String(m[1]).padStart(2,'0')} ${months[parseInt(m[2]) - 1]}`;
                    }
                    return d.date;
                }
                // Fallback: compute from week date_range
                if (!weekStartDate) return '';
                const schoolDays = ['MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];
                const startJsDay = weekStartDate.getDay();
                const startSchoolIdx = startJsDay === 0 ? 6 : startJsDay - 1;
                const targetSchoolIdx = schoolDays.indexOf(d.day);
                let diff = targetSchoolIdx - startSchoolIdx;
                if (diff < 0) diff += 7;
                const dt = new Date(weekStartDate);
                dt.setDate(dt.getDate() + diff);
                const dd = String(dt.getDate()).padStart(2, '0');
                const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
                return `${dd} ${months[dt.getMonth()]}`;
            }

            html += `</div><div class="section-header section-toggle detailed-only" onclick="toggleSection('sec-daily')">DAILY PROGRESS REPORT</div><div id="sec-daily" class="section-content detailed-only">`;
            html += `<div class="daily-grid-header">
                <span style="font-size:0.62rem; color:#93c5fd; font-weight:600;">DAY / DATE / CHECK-IN</span>
                <span style="font-size:0.62rem; color:#c4b5fd; font-weight:600;">MORNING SNACK / INTAKE</span>
                <span style="font-size:0.62rem; color:#6ee7b7; font-weight:600;">AFTERNOON MEAL / INTAKE</span>
                <span style="font-size:0.62rem; color:#7dd3fc; font-weight:600;">SNACK PREFERENCE / HYDRATION</span>
                <span style="font-size:0.62rem; color:#fcd34d; font-weight:600;">REFILLS</span>
                <span style="font-size:0.62rem; color:#f9a8d4; font-weight:600;">ATTIRE</span>
            </div>`;
            days.forEach(d => {
                // Skip days with no data at all (future days with no date)
                const hasAnyData = (d.date && d.date !== '') || (d.snacks && d.snacks !== 'N/A') || (d.lunch && d.lunch !== 'N/A') || (d.arrival_time && d.arrival_time !== 'N/A') || d.snack_completion > 0 || d.lunch_completion > 0 || d.water_completion > 0;
                if (!hasAnyData) return;
                // Skip future days
                if (isFutureDay(d)) return;

                const dayDate = getDayDate(d);
                if (isHoliday(d)) {
                    html += `<div class="daily-grid">
                        <div><div class="snap-day">${d.day}</div><div style="font-size:0.6rem; color:#b0bec5; font-weight:500;">${dayDate}</div></div>
                        <div style="grid-column:2/5; color:#a78bfa; font-style:italic; font-size:0.8rem;">${isSecondSaturday(d) ? '2nd Saturday — Institutional Holiday' : (d.arrival_time || 'HOLIDAY').replace(/HOLIDAY/i, '').trim() ? (d.arrival_time || '').replace(/HOLIDAY/i, '').trim() + ' — School Holiday' : 'School Holiday'}</div>
                        <div style="grid-column:5/7; text-align:center;"><span class="badge" style="background:rgba(167,139,250,0.15); color:#a78bfa;">HOLIDAY</span></div>
                    </div>`;
                    return;
                }
                if (isAbsent(d)) {
                    html += `<div class="daily-grid" style="opacity:0.7;">
                        <div><div class="snap-day">${d.day}</div><div style="font-size:0.6rem; color:#b0bec5; font-weight:500;">${dayDate}</div><div class="snap-time" style="color:#f43f5e;">ABSENT</div></div>
                        <div><div class="snap-value" style="color:#f43f5e; font-style:italic;">Absent</div><div class="snap-bar"><div class="snap-bar-fill" style="width:0%; background:#f43f5e"></div></div></div>
                        <div><div class="snap-value" style="color:#f43f5e; font-style:italic;">Absent</div><div class="snap-bar"><div class="snap-bar-fill" style="width:0%; background:#f43f5e"></div></div></div>
                        <div><div class="snap-value" style="color:#f43f5e; font-style:italic;">Absent</div><div class="snap-bar"><div class="snap-bar-fill" style="width:0%; background:#f43f5e"></div></div></div>
                        <div style="text-align:center; color:#f43f5e; font-size:0.75rem;">--</div>
                        <div style="text-align:center;"><span class="badge badge-yellow">ABSENT</span></div>
                    </div>`;
                    return;
                }
                const sp = pct(d.snack_completion), lp = pct(d.lunch_completion), wp = pct(d.water_completion);
                const uniformBadge = String(d.uniform || '').toUpperCase() === 'YES' ? '<span class="badge badge-green">Uniform</span>' : String(d.uniform || '').toUpperCase() === 'NO' ? '<span class="badge badge-yellow">No</span>' : String(d.uniform || '').toUpperCase().includes('COLOUR') ? '<span class="badge badge-purple">Color Day</span>' : `<span class="badge badge-yellow">${d.uniform}</span>`;
                html += `
                    <div class="daily-grid">
                        <div><div class="snap-day">${d.day}</div><div style="font-size:0.6rem; color:#b0bec5; font-weight:500;">${dayDate}</div><div class="snap-time">${d.arrival_time}</div></div>
                        <div><div class="snap-value">${d.snacks}</div><div class="snap-bar"><div class="snap-bar-fill" style="width:${sp}%; background:linear-gradient(90deg,#7c3aed,#a78bfa)"></div></div><div style="font-size:0.62rem; color:#a78bfa; margin-top:3px; font-weight:500;">${sp}% completed</div></div>
                        <div><div class="snap-value">${d.lunch}</div><div class="snap-bar"><div class="snap-bar-fill" style="width:${lp}%; background:linear-gradient(90deg,#059669,#34d399)"></div></div><div style="font-size:0.62rem; color:#34d399; margin-top:3px; font-weight:500;">${lp}% completed</div></div>
                        <div><div class="snap-value">${d.interested_in}</div><div style="font-size:0.62rem; color:#60a5fa; margin-top:5px; font-weight:500;">Water: ${wp}%</div></div>
                        <div style="text-align:center;"><div style="font-size:1rem; font-weight:700; color:#fbbf24;">${d.bottle_refill}</div><div style="font-size:0.58rem; color:#64748b; font-weight:500;">bottles</div></div>
                        <div style="text-align:center;">${uniformBadge}</div>
                    </div>`;
            });

            // AI Insights - Weekly Summary
            const summary = AIEngine.generateWeeklySummary(selectedStudent, selectedWeekIdx);
            html += `</div>`;
            html += `<div class="ai-card" style="margin-top:2rem;">
                <div class="ai-card-header"><span style="color:#60a5fa;">${icon('fileText')}</span> ${t('weeklySummary')}</div>
                <div class="ai-summary-text">${summary}</div>
            </div>`;

            // AI Insights - Personalized Tips
            const tips = AIEngine.generateTips(selectedStudent, selectedWeekIdx);
            html += `<div class="ai-card">
                <div class="ai-card-header"><span style="color:#f59e0b;">${icon('lightbulb')}</span> ${t('recommendations')}</div>`;
            tips.forEach(t => {
                html += `<div class="ai-tip ai-severity-${t.severity}"><span class="ai-tip-icon">${t.icon}</span><div><span class="ai-tip-text">${t.text}</span>${t.text.length > 100 ? '<span class="ai-tip-more" onclick="this.previousElementSibling.classList.toggle(\'expanded\');this.textContent=this.textContent===\'Read more\'?\'Show less\':\'Read more\';">Read more</span>' : ''}</div></div>`;
            });
            html += `</div>`;

            // AI Insights - Anomaly Detection
            const anomalies = AIEngine.detectAnomalies(selectedStudent, selectedWeekIdx);
            html += `<div class="ai-card">
                <div class="ai-card-header"><span style="color:#60a5fa;">${icon('search')}</span> ${t('observations')}</div>`;
            if (anomalies.length === 0) {
                html += `<div class="ai-tip ai-severity-positive"><span class="ai-tip-icon" style="color:#22c55e">${icon('check')}</span><span class="ai-tip-text">${t('noAnomalies')}</span></div>`;
            } else {
                anomalies.forEach(a => {
                    html += `<div class="ai-tip ai-severity-${a.severity}"><span class="ai-tip-icon">${a.icon}</span><div><span class="ai-tip-text">${a.text}</span>${a.text.length > 100 ? '<span class="ai-tip-more" onclick="this.previousElementSibling.classList.toggle(\'expanded\');this.textContent=this.textContent===\'Read more\'?\'Show less\':\'Read more\';">Read more</span>' : ''}</div></div>`;
                });
            }
            html += `</div>`;

            // Teacher Recommendations (only in admin/teacher mode)
            if (!isParentView) {
            const recs = AIEngine.generateRecommendations(selectedWeekIdx);
            html += `<div class="ai-card">
                <div class="ai-card-header"><span style="color:#60a5fa;">${icon('clipboard')}</span> ${t('teacherRecs')} <span class="ai-badge ai-badge-important" style="margin-left:8px;">${recs.length} items</span></div>`;
            recs.forEach(r => {
                html += `<div class="ai-rec ai-rec-${r.priority}">
                    <span style="font-size:1rem;">${r.icon}</span>
                    <div>
                        <span class="ai-badge ai-badge-${r.priority}">${r.priority}</span>
                        <div style="font-size:0.78rem; color:#cbd5e1; margin-top:5px; line-height:1.5;">${r.text}</div>
                    </div>
                </div>`;
            });
            html += `</div>`;
            }

            return html;
        }

        function downloadPDF() {
            // Force render actual content (bypass skeleton transition) then print
            const main = document.getElementById('main');
            renderSidebar();
            renderMain();
            main.style.opacity = '1';
            main.style.transform = 'none';
            main.style.transition = 'none';
            setTimeout(() => {
                window.print();
                main.style.transition = 'opacity 0.2s ease, transform 0.2s ease';
            }, 200);
        }

        function selectStudent(s) {
            const main = document.getElementById('main');
            main.style.opacity = '0'; main.style.transform = 'translateY(6px)';
            // Reset section collapse states for new student
            ['sec-nourishment','sec-daily','sec-attendance'].forEach(id => localStorage.removeItem('section_' + id));
            setTimeout(() => { selectedStudent = s; selectedWeekIdx = studentsData[s].length - 1; render(); main.style.opacity = '1'; main.style.transform = 'translateY(0)'; }, 150);
        }
        function selectWeek(i) {
            const main = document.getElementById('main');
            main.style.opacity = '0'; main.style.transform = 'translateY(4px)';
            setTimeout(() => { selectedWeekIdx = i; render(); main.style.opacity = '1'; main.style.transform = 'translateY(0)'; }, 120);
        }

        function render() {
            const main = document.getElementById('main');
            // Update sticky header
            const sn = document.getElementById('sticky-name');
            const sm = document.getElementById('sticky-meta');
            if (sn) sn.textContent = selectedStudent ? selectedStudent.charAt(0) + selectedStudent.slice(1).toLowerCase() : '';
            if (sm) sm.textContent = SCHOOL.class;
            main.style.opacity = '0';
            main.style.transform = 'translateY(6px)';
            // Show skeleton briefly
            main.innerHTML = `<div style="padding:2rem 0;"><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:1.2rem;margin-bottom:2rem;">${'<div class="skeleton-card"><div class="skeleton-circle"></div><div class="skeleton-line" style="width:60%"></div><div class="skeleton-line" style="width:40%;height:24px;"></div><div class="skeleton-line" style="width:80%"></div></div>'.repeat(4)}</div><div class="skeleton-card" style="height:120px;"><div class="skeleton-line" style="width:30%;margin-bottom:16px;"></div><div class="skeleton-line" style="width:100%;height:60px;"></div></div></div>`;
            main.style.opacity = '1';
            main.style.transform = 'translateY(0)';
            setTimeout(() => {
                main.style.opacity = '0';
                main.style.transform = 'translateY(6px)';
                setTimeout(() => {
                    renderSidebar(); renderMain();
                    const mb = document.getElementById('school-month-badge');
                    if (mb) mb.textContent = getMonthFromData();
                    main.style.opacity = '1';
                    main.style.transform = 'translateY(0)';
                }, 100);
            }, 200);
        }
        function renderApp() {
            if (Object.keys(studentsData).length === 0) {
                document.getElementById('main').innerHTML = `<div style="display:flex;align-items:center;justify-content:center;min-height:60vh;"><div style="text-align:center;max-width:320px;">
                    <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin:0 auto 16px;display:block;opacity:0.6;"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                    <div style="font-size:1rem;font-weight:600;color:#f8fafc;margin-bottom:6px;">Unable to Load Data</div>
                    <div style="font-size:0.75rem;color:#94a3b8;line-height:1.6;margin-bottom:20px;">We couldn't connect to the school records. This may be due to a network issue or temporary server unavailability.</div>
                    <button onclick="location.reload()" style="background:linear-gradient(135deg,#1e40af,#2563eb);color:#fff;border:none;padding:10px 24px;border-radius:20px;font-size:0.78rem;font-weight:600;cursor:pointer;font-family:inherit;box-shadow:0 4px 16px rgba(59,130,246,0.3);transition:all 0.2s;">Retry</button>
                </div></div>`;
                return;
            }
            isParentView = parentMode && studentsData[parentMode.toUpperCase()];
            selectedStudent = isParentView ? parentMode.toUpperCase() : Object.keys(studentsData)[0];
            selectedWeekIdx = studentsData[selectedStudent].length - 1;
            render();
        }

        // Show loading state, then fetch live data
        document.getElementById('main').innerHTML = `<div style="display:flex;align-items:center;justify-content:center;min-height:80vh;">
            <div style="text-align:center;animation:fadeIn 0.4s ease;">
                <img src="images/fps-tree-logo.jpg" alt="FuturON Preschool" style="width:72px;height:72px;border-radius:16px;object-fit:contain;background:#fff;border:2px solid rgba(51,65,85,0.3);padding:4px;margin-bottom:14px;box-shadow:0 4px 20px rgba(0,0,0,0.15);animation:logoFloat 3s ease-in-out infinite;" />
                <div style="font-size:1.3rem;font-weight:800;color:#f8fafc;letter-spacing:-0.02em;margin-bottom:4px;">FuturON Pre School</div>
                <div style="font-size:0.8rem;font-weight:500;color:#94a3b8;margin-bottom:12px;">Jammalamadugu</div>
                <div style="font-size:0.75rem;color:#f59e0b;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:24px;">${t('creatingFutureCEOs')}</div>
                <div style="display:flex;align-items:center;justify-content:center;gap:6px;">
                    <span style="width:8px;height:8px;background:#3b82f6;border-radius:50%;display:inline-block;animation:bounceDot 1.4s infinite ease-in-out;animation-delay:0s;"></span>
                    <span style="width:8px;height:8px;background:#60a5fa;border-radius:50%;display:inline-block;animation:bounceDot 1.4s infinite ease-in-out;animation-delay:0.2s;"></span>
                    <span style="width:8px;height:8px;background:#93c5fd;border-radius:50%;display:inline-block;animation:bounceDot 1.4s infinite ease-in-out;animation-delay:0.4s;"></span>
                </div>
                <div style="font-size:0.68rem;color:#64748b;margin-top:12px;">${t('loadingRecords')}</div>
            </div>
        </div>`;
        loadData();
        // Scroll-linked sticky header
        window.addEventListener('scroll', () => {
            const sh = document.getElementById('sticky-header');
            if (sh) sh.classList.toggle('visible', window.scrollY > 180);
        }, { passive: true });
    </script>
</body>
</html>
